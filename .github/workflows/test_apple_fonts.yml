name: Test Apple fonts script

on:
  schedule:
    - cron: '17 12 1 * *'   
  workflow_dispatch:
  pull_request:

jobs:
  download_apple_fonts:
    strategy:
      matrix:
        runs-on: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .dart_tool/
            build/
            .flutter-plugins-dependencies
            pubspec.lock

            demo/.dart_tool/
            demo/build/
            demo/.flutter-plugins-dependencies
            demo/pubspec.lock
          key: ${{ runner.OS }}-${{ hashFiles('**/pubspec.yaml') }}-${{ hashFiles('**/*.dart') }}
          restore-keys: |
            ${{ runner.OS }}-

      - name: Install Flutter
        id: install_flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:'

      - run: flutter pub get
        shell: bash
      
      - name: Remove cached Apple fonts
        shell: bash
        env:
          PUB_CACHE: ${{ steps.install_flutter.outputs.PUB-CACHE-PATH }}
        run: rm -rf "${PUB_CACHE}/golden_screenshot/SF-Pro"

      - name: Download Apple fonts
        shell: bash
        run: dart run golden_screenshot:download_apple_fonts --verbose

      - name: Assert fonts exist
        shell: bash
        env:
          PUB_CACHE: ${{ steps.install_flutter.outputs.PUB-CACHE-PATH }}
        run: |
          if [ ! -f "${PUB_CACHE}/golden_screenshot/SF-Pro/SF-Pro-Text-Regular.otf" ]; then
            exit 1
          fi
